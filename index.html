<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelayanan Desa Muning Baru</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:#050505;
    text-align:center;
}

/* JUDUL */
h2 {
    color:white;
    margin:20px;
}

/* CONTAINER */
.wrapper {
    position:relative;
    max-width:1000px;
    margin:auto;
}

/* GAMBAR */
.wrapper img {
    width:100%;
    border-radius:20px;
}

/* OVERLAY */
.overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(to top, rgba(0,0,0,0.25), transparent);
    border-radius:20px;
}

/* TOMBOL */
.btn {
    position:absolute;
    width:28%;
    height:42%;
    top:60%;
    transform:translateY(-55%);
    cursor:pointer;
    border-radius:20px;
}

/* POSISI */
.btn1 { left:5%; }
.btn2 { left:36%; }
.btn3 { left:67%; }

/* HOVER */
.btn:hover {
    background:rgba(255,255,255,0.1);
    box-shadow:0 0 20px rgba(0,255,200,0.5);
}

/* ========================= */
/* JAM REALISTIS */
/* ========================= */

.clock {
    position:absolute;
    top:20px;
    right:20px;
    width:120px;
    height:120px;
    border:6px solid black;
    border-radius:50%;
    background:white;
    box-shadow:0 0 15px rgba(0,0,0,0.6);
}

/* angka */
.number {
    position:absolute;
    width:100%;
    height:100%;
    text-align:center;
    font-weight:bold;
    font-size:14px;
}

.number span {
    position:absolute;
    left:50%;
    transform:translateX(-50%);
}

.n12 span { top:5px; }
.n3 span { right:5px; top:50%; transform:translateY(-50%); }
.n6 span { bottom:5px; }
.n9 span { left:5px; top:50%; transform:translateY(-50%); }

/* jarum */
.hand {
    position:absolute;
    bottom:50%;
    left:50%;
    transform-origin:bottom;
    transform:translateX(-50%);
}

.hour {
    width:4px;
    height:30px;
    background:black;
}

.minute {
    width:3px;
    height:40px;
    background:black;
}

.second {
    width:2px;
    height:45px;
    background:red;
}

/* titik tengah */
.center {
    position:absolute;
    width:8px;
    height:8px;
    background:red;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
}

/* RUNNING TEXT */
.running-text {
    width:100%;
    overflow:hidden;
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    color:white;
    padding:10px 0;
    margin-top:20px;
}

.running-text p {
    display:inline-block;
    white-space:nowrap;
    animation:jalan 12s linear infinite;
    font-weight:bold;
}

@keyframes jalan {
    from { transform:translateX(100%); }
    to { transform:translateX(-100%); }
}

/* RESPONSIVE */
@media(max-width:768px){
    .clock {
        width:80px;
        height:80px;
    }
}
</style>
</head>

<body>

<h2>Pelayanan Digital Desa Muning Baru</h2>

<div class="wrapper">

    <img src="template-pelayanan.png">
    <div class="overlay"></div>

    <!-- JAM -->
    <div class="clock">
        <div class="number n12"><span>12</span></div>
        <div class="number n3"><span>3</span></div>
        <div class="number n6"><span>6</span></div>
        <div class="number n9"><span>9</span></div>

        <div class="hand hour"></div>
        <div class="hand minute"></div>
        <div class="hand second"></div>

        <div class="center"></div>
    </div>

    <!-- TOMBOL -->
    <div class="btn btn1" onclick="buka('https://forms.gle/8ipvJkeh76VHPsAW8')"></div>

    <div class="btn btn2" onclick="buka('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')"></div>

    <div class="btn btn3" onclick="buka('https://forms.gle/o864Q2Jdh42QEXRB7')"></div>

</div>

<!-- RUNNING TEXT -->
<div class="running-text">
    <p>✨ SELAMAT DATANG DI PELAYANAN KANTOR DESA MUNING BARU ✨</p>
</div>

<script>
function buka(url){
    window.open(url, "_blank");
}

/* JAM */
function updateClock(){
    const now = new Date();

    const sec = now.getSeconds();
    const min = now.getMinutes();
    const hr = now.getHours();

    const secDeg = sec * 6;
    const minDeg = min * 6;
    const hrDeg = (hr % 12) * 30 + min / 2;

    document.querySelector('.second').style.transform =
        `translateX(-50%) rotate(${secDeg}deg)`;

    document.querySelector('.minute').style.transform =
        `translateX(-50%) rotate(${minDeg}deg)`;

    document.querySelector('.hour').style.transform =
        `translateX(-50%) rotate(${hrDeg}deg)`;
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
