<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desa Muning Baru</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0b0b0b;
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#111;
    position:sticky;
    top:0;
    z-index:1000;
}
.navbar h2 {margin:0;}
.navbar a {
    color:white;
    text-decoration:none;
    margin-left:20px;
}

/* HERO */
.hero img {
    width:100%;
}

/* MENU */
.menu {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card {
    width:300px;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.card:hover {
    transform:scale(1.05);
}

.card img {
    width:100%;
}

.card h3 {
    text-align:center;
    padding:15px;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    z-index:2000;
}

.modal-content {
    width:90%;
    height:90%;
    margin:3% auto;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

.modal iframe {
    width:100%;
    height:100%;
    border:none;
}

/* CLOSE */
.close {
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
}

/* FOOTER */
.footer {
    text-align:center;
    padding:20px;
    background:#111;
}

/* RESPONSIVE */
@media(max-width:768px){
    .menu {
        flex-direction:column;
        align-items:center;
    }
}
</style>

</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <h2>Desa Muning Baru</h2>
    <div>
        <a href="#">Home</a>
        <a href="#layanan">Layanan</a>
        <a href="#">Kontak</a>
    </div>
</div>

<!-- HERO -->
<div class="hero">
    <img src="template-pelayanan.png">
</div>

<!-- MENU -->
<div id="layanan" class="menu">

    <div class="card" onclick="openModal('https://forms.gle/8ipvJkeh76VHPsAW8')">
        <img src="template-pelayanan.png">
        <h3>Buku Tamu</h3>
    </div>

    <div class="card" onclick="openModal('https://sites.google.com/view/kumpulanpersyaratan/halaman-muka')">
        <img src="template-pelayanan.png">
        <h3>Pelayanan Surat</h3>
    </div>

    <div class="card" onclick="openModal('https://forms.gle/o864Q2Jdh42QEXRB7')">
        <img src="template-pelayanan.png">
        <h3>Aduan & Saran</h3>
    </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <span class="close" onclick="closeModal()">✖</span>
    <div class="modal-content">
        <iframe id="frame"></iframe>
    </div>
</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 Desa Muning Baru - Melayani Sepenuh Hati
</div>

<script>
function openModal(link){
    document.getElementById("modal").style.display="block";
    document.getElementById("frame").src=link;
}

function closeModal(){
    document.getElementById("modal").style.display="none";
    document.getElementById("frame").src="";
}
</script>

</body>
</html>
