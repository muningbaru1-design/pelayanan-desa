<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiMUNBAR - Pelayanan Desa</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0b0b0b;
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:#111;
}

/* LOGO */
.logo-box img {
    height:60px;
}

/* JAM DIGITAL */
.clock {
    text-align:right;
}
.clock-time {
    font-size:28px;
    color:#00ffd5;
    font-weight:bold;
}
.clock-date {
    font-size:14px;
}

/* HERO */
.hero img {
    width:100%;
}

/* MENU */
.menu {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card {
    width:300px;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.card:hover {
    transform:scale(1.05);
}

.card img {
    width:100%;
}

.card h3 {
    text-align:center;
    padding:15px;
}

/* TEXT BERJALAN */
.marquee {
    background:#111;
    padding:10px;
    text-align:center;
    color:#00ffd5;
    font-weight:bold;
}

/* FOOTER */
.footer {
    text-align:center;
    padding:20px;
    background:#111;
}

@media(max-width:768px){
    .menu {
        flex-direction:column;
        align-items:center;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <!-- LOGO -->
    <div class="logo-box">
        <img src="https://muningbaru1-design.github.io/pelayanan-desa/logo-simunbar.png">
    </div>

    <!-- JAM -->
    <div class="clock">
        <div class="clock-time" id="jam"></div>
        <div class="clock-date" id="tanggal"></div>
    </div>

</div>

<!-- HERO -->
<div class="hero">
    <img src="template-pelayanan.png">
</div>

<!-- TEXT BERJALAN -->
<div class="marquee">
    <marquee>SELAMAT DATANG DI PELAYANAN KANTOR DESA MUNING BARU</marquee>
</div>

<!-- MENU -->
<div class="menu">

    <!-- BUKU TAMU -->
    <div class="card" onclick="window.open('https://forms.gle/8ipvJkeh76VHPsAW8','_blank')">
        <img src="template-pelayanan.png">
        <h3>Buku Tamu</h3>
    </div>

    <!-- PELAYANAN SURAT -->
    <div class="card" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform','_blank')">
        <img src="template-pelayanan.png">
        <h3>Pelayanan Surat 🔴 <span id="notifSurat">0</span></h3>
    </div>

    <!-- ADUAN -->
    <div class="card" onclick="window.open('https://forms.gle/o864Q2Jdh42QEXRB7','_blank')">
        <img src="template-pelayanan.png">
        <h3>Aduan & Saran 🔴 <span id="notifAduan">0</span></h3>
    </div>

</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 Desa Muning Baru - Melayani Sepenuh Hati
</div>

<script>

/* JAM DIGITAL */
function updateJam() {
    const now = new Date();

    let jam = now.toLocaleTimeString('id-ID');
    let tanggal = now.toLocaleDateString('id-ID', {
        weekday:'long',
        day:'numeric',
        month:'long',
        year:'numeric'
    });

    document.getElementById("jam").innerText = jam;
    document.getElementById("tanggal").innerText = tanggal;
}
setInterval(updateJam,1000);
updateJam();

/* NOTIFIKASI DATA */
async function ambilData() {

  const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSNSqZmr8mhDwdRlNFZUvnKE9MRyT5zFKi4YiNXWukqp6zZuoCRoluLdBtgMBpJEZ84xI0Oc9cuo4Io/pub?gid=595147775&single=true&output=csv";

  const res = await fetch(url);
  const text = await res.text();

  const rows = text.split("\n");

  let surat = 0;
  let aduan = 0;

  for (let i = 1; i < rows.length; i++) {
    let data = rows[i].toLowerCase();

    if (data.includes("surat")) surat++;
    if (data.includes("aduan") || data.includes("saran")) aduan++;
  }

  document.getElementById("notifSurat").innerText = surat;
  document.getElementById("notifAduan").innerText = aduan;
}

ambilData();

</script>

</body>
</html>
