<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiMUNBAR - Pelayanan Desa</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0b0b0b;
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    background:#111;
}

/* LOGO */
.logo-box img {
    height:60px;
}

/* JAM */
.clock {
    text-align:right;
}
.clock-time {
    font-size:26px;
    color:#00ffd5;
    font-weight:bold;
}
.clock-date {
    font-size:14px;
}

/* HERO */
.hero img {
    width:100%;
}

/* MENU */
.menu {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}

.card {
    width:300px;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.card:hover {
    transform:scale(1.05);
}

.card img {
    width:100%;
}

.card h3 {
    text-align:center;
    padding:15px;
}

/* TOMBOL SCREEN */
.screen-btn {
    display:block;
    margin:10px auto 15px;
    padding:8px 15px;
    background:#00ffd5;
    color:black;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}
.screen-btn:hover {
    background:#00c2a5;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    z-index:9999;
}
.modal iframe {
    width:90%;
    height:90%;
    margin:3% auto;
    display:block;
    border:none;
    background:white;
    border-radius:10px;
}
.close {
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    color:white;
    cursor:pointer;
}

/* TEXT BERJALAN */
.marquee {
    background:#111;
    padding:10px;
    text-align:center;
    color:#00ffd5;
    font-weight:bold;
}

/* FOOTER */
.footer {
    text-align:center;
    padding:20px;
    background:#111;
}

@media(max-width:768px){
    .menu {
        flex-direction:column;
        align-items:center;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo-box">
        <img src="https://muningbaru1-design.github.io/pelayanan-desa/logo-simunbar.png">
    </div>

    <div class="clock">
        <div class="clock-time" id="jam"></div>
        <div class="clock-date" id="tanggal"></div>
    </div>
</div>

<!-- HERO -->
<div class="hero">
    <img src="template-pelayanan.png">
</div>

<!-- TEXT BERJALAN -->
<div class="marquee">
    <marquee>SELAMAT DATANG DI PELAYANAN KANTOR DESA MUNING BARU</marquee>
</div>

<!-- MENU -->
<div class="menu">

    <!-- BUKU TAMU -->
    <div class="card" onclick="window.open('https://forms.gle/8ipvJkeh76VHPsAW8','_blank')">
        <img src="template-pelayanan.png">
        <h3>Buku Tamu 🔵 <span id="notifTamu">0</span></h3>
        <button class="screen-btn" onclick="event.stopPropagation(); openModal('https://forms.gle/8ipvJkeh76VHPsAW8')">Screen</button>
    </div>

    <!-- SURAT -->
    <div class="card" onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform','_blank')">
        <img src="template-pelayanan.png">
        <h3>Pelayanan Surat 🔴 <span id="notifSurat">0</span></h3>
        <button class="screen-btn" onclick="event.stopPropagation(); openModal('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')">Screen</button>
    </div>

    <!-- ADUAN -->
    <div class="card" onclick="window.open('https://forms.gle/o864Q2Jdh42QEXRB7','_blank')">
        <img src="template-pelayanan.png">
        <h3>Aduan & Saran 🔴 <span id="notifAduan">0</span></h3>
        <button class="screen-btn" onclick="event.stopPropagation(); openModal('https://forms.gle/o864Q2Jdh42QEXRB7')">Screen</button>
    </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <span class="close" onclick="closeModal()">✖</span>
    <iframe id="frame"></iframe>
</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 Desa Muning Baru - Melayani Sepenuh Hati
</div>

<script>

/* JAM */
function updateJam() {
    const now = new Date();

    document.getElementById("jam").innerText =
        now.getHours().toString().padStart(2,'0') + ":" +
        now.getMinutes().toString().padStart(2,'0') + ":" +
        now.getSeconds().toString().padStart(2,'0');

    document.getElementById("tanggal").innerText =
        now.toLocaleDateString('id-ID', {
            weekday:'long',
            day:'numeric',
            month:'long',
            year:'numeric'
        });
}
setInterval(updateJam,1000);
updateJam();

/* MODAL */
function openModal(link){
    document.getElementById("modal").style.display="block";
    document.getElementById("frame").src=link;
}
function closeModal(){
    document.getElementById("modal").style.display="none";
    document.getElementById("frame").src="";
}

/* NOTIFIKASI */
async function ambilData() {

  const urlTamu = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTf0YY597JgnBlEeoq375PxbGMzpq0Eum3qF57iU-HvAG0GviT8x7Feh6pvwm16bVfbtGRVWiHTtln5/pub?gid=53317010&single=true&output=csv";
  const urlSurat = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSNSqZmr8mhDwdRlNFZUvnKE9MRyT5zFKi4YiNXWukqp6zZuoCRoluLdBtgMBpJEZ84xI0Oc9cuo4Io/pub?gid=595147775&single=true&output=csv";
  const urlAduan = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_5xLKXz0SzzQgs-CTw7M3A5hiVZ2UyttODKK-vPFVvHup81fE_wLus-FWCXygXVxJ2te9Ni5FqSoD/pub?gid=1837680240&single=true&output=csv";

  const [tamu, surat, aduan] = await Promise.all([
    fetch(urlTamu).then(r=>r.text()),
    fetch(urlSurat).then(r=>r.text()),
    fetch(urlAduan).then(r=>r.text())
  ]);

  document.getElementById("notifTamu").innerText = tamu.split("\n").length - 1;
  document.getElementById("notifSurat").innerText = surat.split("\n").length - 1;
  document.getElementById("notifAduan").innerText = aduan.split("\n").length - 1;
}

ambilData();

</script>

</body>
</html>
