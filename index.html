<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelayanan Desa Muning Baru</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:#050505;
    text-align:center;
}

/* JUDUL */
h2 {
    color:white;
    margin:20px;
}

/* CONTAINER */
.wrapper {
    position:relative;
    max-width:1000px;
    margin:auto;
}

/* GAMBAR */
.wrapper img {
    width:100%;
    border-radius:20px;
}

/* OVERLAY */
.overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(to top, rgba(0,0,0,0.25), transparent);
    border-radius:20px;
}

/* TOMBOL */
.btn {
    position:absolute;
    width:28%;
    height:42%;
    top:60%;
    transform:translateY(-55%);
    cursor:pointer;
    border-radius:20px;
}

/* POSISI */
.btn1 { left:5%; }
.btn2 { left:36%; }
.btn3 { left:67%; }

/* HOVER */
.btn:hover {
    background:rgba(255,255,255,0.1);
    box-shadow:0 0 20px rgba(0,255,200,0.5);
}

/* ========================= */
/* JAM DIGITAL */
/* ========================= */

.clock-box {
    position:absolute;
    top:20px;
    right:20px;
    background:rgba(0,0,0,0.6);
    padding:10px 15px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,255,200,0.6);
    backdrop-filter:blur(5px);
    text-align:center;
}

.time {
    font-size:24px;
    font-weight:bold;
    color:#00ffd5;
}

.date {
    font-size:12px;
    margin-top:5px;
    color:white;
}

/* RUNNING TEXT */
.running-text {
    width:100%;
    overflow:hidden;
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    color:white;
    padding:10px 0;
    margin-top:20px;
}

.running-text p {
    display:inline-block;
    white-space:nowrap;
    animation:jalan 12s linear infinite;
    font-weight:bold;
}

@keyframes jalan {
    from { transform:translateX(100%); }
    to { transform:translateX(-100%); }
}

/* RESPONSIVE */
@media(max-width:768px){
    .clock-box {
        top:10px;
        right:10px;
    }
}
</style>
</head>

<body>

<h2>Pelayanan Digital Desa Muning Baru</h2>

<div class="wrapper">

    <img src="template-pelayanan.png">
    <div class="overlay"></div>

    <!-- JAM DIGITAL -->
    <div class="clock-box">
        <div class="time" id="jam"></div>
        <div class="date" id="tanggal"></div>
    </div>

    <!-- TOMBOL -->
    <div class="btn btn1" onclick="buka('https://forms.gle/8ipvJkeh76VHPsAW8')"></div>

    <div class="btn btn2" onclick="buka('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')"></div>

    <div class="btn btn3" onclick="buka('https://forms.gle/o864Q2Jdh42QEXRB7')"></div>

</div>

<!-- RUNNING TEXT -->
<div class="running-text">
    <p>✨ SELAMAT DATANG DI PELAYANAN KANTOR DESA MUNING BARU ✨</p>
</div>

<script>
function buka(url){
    window.open(url, "_blank");
}

/* JAM DIGITAL */
function updateJam(){
    const now = new Date();

    const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

    let h = String(now.getHours()).padStart(2,'0');
    let m = String(now.getMinutes()).padStart(2,'0');
    let s = String(now.getSeconds()).padStart(2,'0');

    document.getElementById("jam").innerHTML = `${h}:${m}:${s}`;

    document.getElementById("tanggal").innerHTML =
        `${hari[now.getDay()]}, ${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()}`;
}

setInterval(updateJam,1000);
updateJam();
</script>

</body>
</html>
