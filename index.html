<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pelayanan Digital Desa Muning Baru</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #111, #000);
  color: white;
  text-align: center;
}

/* HEADER */
.header {
  padding: 20px;
}

.logo {
  width: 90px;
  margin-bottom: 10px;
}

.header h1 {
  color: gold;
  margin: 5px 0;
}

.clock {
  font-size: 16px;
  opacity: 0.8;
}

/* CONTAINER */
.container {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 30px;
  flex-wrap: wrap;
}

/* CARD */
.card {
  width: 260px;
  height: 200px;
  border-radius: 25px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  cursor: pointer;
  transition: 0.3s;
  position: relative;
  overflow: hidden;
}

/* NEON */
.card::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 25px;
  background: linear-gradient(45deg, #00ffcc, #ff00ff, #00ffcc);
  filter: blur(12px);
  opacity: 0.6;
  z-index: -1;
  animation: glow 4s linear infinite;
}

@keyframes glow {
  0% { filter: blur(8px) hue-rotate(0deg); }
  100% { filter: blur(12px) hue-rotate(360deg); }
}

/* HOVER */
.card:hover {
  transform: scale(1.05);
}

/* ICON */
.icon {
  font-size: 45px;
  margin-top: 40px;
}

/* TEXT */
.card h2 {
  margin: 10px 0 0;
}

.card p {
  font-size: 14px;
  opacity: 0.7;
  padding: 0 15px;
}

/* COLORS */
.tamu { background: linear-gradient(135deg, #065f46, #022c22); }
.surat { background: linear-gradient(135deg, #1e3a8a, #0c1c4d); }
.aduan { background: linear-gradient(135deg, #6b21a8, #2e1065); }

/* FOOTER */
.footer {
  margin-top: 10px;
  font-size: 14px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="header">
  <!-- GANTI LINK LOGO DI SINI -->
  <img src="LINK_LOGO_KAMU" class="logo">
  
  <h1>PELAYANAN DIGITAL</h1>
  <div class="clock" id="clock"></div>
</div>

<div class="container">

<div class="card tamu" onclick="goLink('LINK_BUKU_TAMU')">
  <div class="icon">📖</div>
  <h2>Buku Tamu</h2>
  <p>Isi kehadiran</p>
</div>

<div class="card surat" onclick="goLink('LINK_SURAT')">
  <div class="icon">📄</div>
  <h2>Pelayanan Surat</h2>
  <p>Lihat persyaratan</p>
</div>

<div class="card aduan" onclick="goLink('LINK_ADUAN')">
  <div class="icon">💬</div>
  <h2>Aduan & Saran</h2>
  <p>Sampaikan masukan</p>
</div>

</div>

<div class="footer">
  Desa Muning Baru • Melayani dengan sepenuh hati 💛
</div>

<!-- SUARA KLIK -->
<audio id="clickSound">
  <source src="https://www.soundjay.com/buttons/sounds/button-16.mp3" type="audio/mpeg">
</audio>

<script>
// JAM REALTIME
function updateClock() {
  const now = new Date();
  const time = now.toLocaleTimeString('id-ID');
  const date = now.toLocaleDateString('id-ID');
  document.getElementById('clock').innerHTML = date + " | " + time;
}
setInterval(updateClock, 1000);
updateClock();

// SUARA + NAVIGASI
function goLink(url) {
  document.getElementById("clickSound").play();
  setTimeout(() => {
    window.location.href = url;
  }, 200);
}
</script>

</body>
</html>
