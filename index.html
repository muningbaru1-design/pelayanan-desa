<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiMUNBAR - Pelayanan Desa</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:#050505;
    text-align:center;
}

/* LOGO */
.logo-box {
    margin:20px;
}

.logo-box img {
    width:320px;
    max-width:90%;
    filter:drop-shadow(0 0 15px rgba(0,255,200,0.5));
}

/* WRAPPER */
.wrapper {
    position:relative;
    max-width:1000px;
    margin:auto;
}

.wrapper img {
    width:100%;
    border-radius:20px;
}

.overlay {
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    background:linear-gradient(to top, rgba(0,0,0,0.25), transparent);
    border-radius:20px;
}

/* TOMBOL GAMBAR */
.btn {
    position:absolute;
    width:28%;
    height:42%;
    top:60%;
    transform:translateY(-55%);
    cursor:pointer;
    border-radius:20px;
}

.btn1 { left:5%; }
.btn2 { left:36%; }
.btn3 { left:67%; }

.btn:hover {
    background:rgba(255,255,255,0.1);
    box-shadow:0 0 20px rgba(0,255,200,0.5);
}

/* JAM */
.clock-box {
    position:absolute;
    top:20px;
    right:20px;
    background:rgba(0,0,0,0.6);
    padding:10px 15px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,255,200,0.6);
}

.time {
    font-size:22px;
    color:#00ffd5;
    font-weight:bold;
}

.date {
    font-size:12px;
    color:white;
}

/* MENU TAMBAHAN */
.extra-menu {
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.extra-btn {
    padding:15px 25px;
    border-radius:15px;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    color:white;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.extra-btn:hover {
    transform:scale(1.05);
    box-shadow:0 0 15px rgba(0,255,200,0.6);
}

/* RUNNING TEXT */
.running-text {
    margin-top:20px;
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    padding:10px;
    color:white;
    overflow:hidden;
}

.running-text p {
    display:inline-block;
    white-space:nowrap;
    animation:jalan 12s linear infinite;
}

@keyframes jalan {
    from { transform:translateX(100%); }
    to { transform:translateX(-100%); }
}

/* POPUP */
#popup {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    z-index:9999;
}
</style>
</head>

<body>

<!-- LOGO -->
<div class="logo-box">
    <img src="https://muningbaru1-design.github.io/pelayanan-desa/logo-simunbar.png">
</div>

<!-- GAMBAR UTAMA -->
<div class="wrapper">

    <img src="template-pelayanan.png">
    <div class="overlay"></div>

    <!-- JAM -->
    <div class="clock-box">
        <div id="jam" class="time"></div>
        <div id="tanggal" class="date"></div>
    </div>

    <!-- MENU UTAMA -->
    <div class="btn btn1" onclick="buka('https://forms.gle/8ipvJkeh76VHPsAW8')"></div>

    <div class="btn btn2" onclick="buka('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')"></div>

    <div class="btn btn3" onclick="buka('https://forms.gle/o864Q2Jdh42QEXRB7')"></div>

</div>

<!-- MENU TAMBAHAN -->
<div class="extra-menu">
    <div class="extra-btn" onclick="bukaCek()">🔍 Cek Status Surat</div>
    <div class="extra-btn" onclick="buka('https://muningbaru1.blogspot.com/?m=1')">📄 Persyaratan Surat</div>
</div>

<!-- RUNNING TEXT -->
<div class="running-text">
<p>✨ SELAMAT DATANG DI PELAYANAN KANTOR DESA MUNING BARU ✨</p>
</div>

<!-- BERITA DESA -->
<div style="margin:40px;">
    <button onclick="window.open('https://muningbaru1.blogspot.com/?m=1','_blank')" 
    style="
        padding:18px 30px;
        font-size:16px;
        border-radius:20px;
        border:none;
        cursor:pointer;
        background:linear-gradient(135deg,#00c6ff,#0072ff);
        color:white;
        box-shadow:0 0 20px rgba(0,255,200,0.6);
    ">
        📰 Lihat Berita Desa
    </button>
</div>

<!-- POPUP CEK STATUS -->
<div id="popup">
<div style="background:white; color:black; padding:20px; width:300px; margin:100px auto; border-radius:15px;">
<h3>🔍 Cek Status Surat</h3>
<input id="cari" placeholder="Masukkan NIK / Nama" style="width:90%; padding:10px;"><br><br>
<button onclick="cekData()">Cek</button>
<button onclick="tutup()">Tutup</button>
<p id="hasil"></p>
</div>
</div>

<script>
function buka(url){ window.open(url,"_blank"); }

/* JAM */
function updateJam(){
const now=new Date();
const hari=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const bulan=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

document.getElementById("jam").innerHTML=
now.getHours().toString().padStart(2,'0')+":"+
now.getMinutes().toString().padStart(2,'0')+":"+
now.getSeconds().toString().padStart(2,'0');

document.getElementById("tanggal").innerHTML=
hari[now.getDay()]+", "+now.getDate()+" "+bulan[now.getMonth()]+" "+now.getFullYear();
}
setInterval(updateJam,1000);
updateJam();

/* POPUP */
function bukaCek(){ document.getElementById("popup").style.display="block"; }
function tutup(){ document.getElementById("popup").style.display="none"; }

/* CEK STATUS */
async function cekData(){
const keyword=document.getElementById("cari").value.toLowerCase().trim();

const url="https://docs.google.com/spreadsheets/d/e/2PACX-1vSNSqZmr8mhDwdRlNFZUvnKE9MRyT5zFKi4YiNXWukqp6zZuoCRoluLdBtgMBpJEZ84xI0Oc9cuo4Io/pub?gid=595147775&single=true&output=csv";

const res=await fetch(url);
const data=await res.text();
const rows=data.split("\n");

let ketemu=false;

for(let i=1;i<rows.length;i++){
const kolom=rows[i].replace(/"/g,'').split(",");
const nama=kolom[1]?.toLowerCase().trim();
const nik=kolom[2]?.toLowerCase().trim();
const status=kolom[4];

if(nama?.includes(keyword)||nik?.includes(keyword)){
document.getElementById("hasil").innerHTML="📄 Status: <b>"+status+"</b>";
ketemu=true;
break;
}
}

if(!ketemu){
document.getElementById("hasil").innerHTML="❌ Data tidak ditemukan";
}
}
</script>

</body>
</html>
