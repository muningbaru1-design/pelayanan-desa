<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiMUNBAR</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#0b0b0b;
    color:white;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#111;
}
.logo-box img{height:60px}

/* JAM */
.clock-time{font-size:26px;color:#00ffd5}
.clock-date{font-size:14px}

/* HERO */
.hero-wrap{
    position:relative;
    max-width:1200px;
    margin:auto;
}
.hero-img{
    width:100%;
    display:block;
}

/* ========================= */
/* HOTSPOT ICON SHAPE GLOW   */
/* ========================= */

.icon-area{
    position:absolute;
    cursor:pointer;
}

/* POSISI */
.tamu{ top:50%; left:6%; width:26%; height:34%; }
.surat{ top:50%; left:37%; width:26%; height:34%; }
.aduan{ top:50%; left:68%; width:26%; height:34%; }

/* GLOW IKON (PAKAI MASK) */
.icon-area::before{
    content:"";
    position:absolute;
    inset:0;

    /* INI KUNCI UTAMA */
    -webkit-mask: radial-gradient(circle at center, white 40%, transparent 70%);
    mask: radial-gradient(circle at center, white 40%, transparent 70%);

    background:linear-gradient(
        to top,
        rgba(0,255,213,0.5),
        rgba(0,255,213,0.2),
        transparent
    );

    filter:blur(20px);
    animation:glowPulse 2.5s infinite;
}

/* SCAN BERGERAK */
.icon-area::after{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    top:-100%;
    left:-100%;

    background:linear-gradient(
        120deg,
        transparent,
        rgba(0,255,213,0.4),
        transparent
    );
}

/* ARAH BERBEDA */
.tamu::after{ animation:scanLeft 3s linear infinite; }
.surat::after{ animation:scanCenter 3s linear infinite; }
.aduan::after{ animation:scanRight 3s linear infinite; }

/* HOVER */
.icon-area:hover::before{
    filter:blur(25px);
}

/* KLIK */
.icon-area:active{
    transform:scale(0.95);
}

/* ANIMASI */
@keyframes glowPulse{
    0%{opacity:0.5}
    50%{opacity:1}
    100%{opacity:0.5}
}

@keyframes scanCenter{
    0%{transform:translate(-100%,-100%) rotate(25deg)}
    100%{transform:translate(100%,100%) rotate(25deg)}
}

@keyframes scanLeft{
    0%{transform:translate(-100%,-100%) rotate(-25deg)}
    100%{transform:translate(100%,100%) rotate(-25deg)}
}

@keyframes scanRight{
    0%{transform:translate(-100%,-100%) rotate(45deg)}
    100%{transform:translate(100%,100%) rotate(45deg)}
}

/* TEXT */
.marquee{
    background:#111;
    padding:10px;
    text-align:center;
    color:#00ffd5;
}

/* MENU */
.menu{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}
.card{
    width:300px;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}
.card:hover{transform:scale(1.05)}
.card img{width:100%}
.card h3{text-align:center;padding:15px}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
}
.modal iframe{
    width:90%;
    height:90%;
    margin:3% auto;
    display:block;
}
.close{
    position:absolute;
    right:20px;
    top:10px;
    font-size:30px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="navbar">
<div class="logo-box">
<img src="https://muningbaru1-design.github.io/pelayanan-desa/logo-simunbar.png">
</div>

<div>
<div class="clock-time" id="jam"></div>
<div class="clock-date" id="tanggal"></div>
</div>
</div>

<!-- HERO -->
<div class="hero-wrap">
<img src="template-pelayanan.png" class="hero-img">

<div class="icon-area tamu" onclick="openModal('https://forms.gle/8ipvJkeh76VHPsAW8')"></div>
<div class="icon-area surat" onclick="openModal('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')"></div>
<div class="icon-area aduan" onclick="openModal('https://forms.gle/o864Q2Jdh42QEXRB7')"></div>
</div>

<div class="marquee">
<marquee>SELAMAT DATANG DI PELAYANAN DESA MUNING BARU</marquee>
</div>

<div class="menu">
<div class="card" onclick="openModal('https://forms.gle/8ipvJkeh76VHPsAW8')">
<img src="template-pelayanan.png">
<h3>Buku Tamu 🔵</h3>
</div>

<div class="card" onclick="openModal('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')">
<img src="template-pelayanan.png">
<h3>Pelayanan Surat 🔴</h3>
</div>

<div class="card" onclick="openModal('https://forms.gle/o864Q2Jdh42QEXRB7')">
<img src="template-pelayanan.png">
<h3>Aduan & Saran 🔴</h3>
</div>
</div>

<div id="modal" class="modal">
<span class="close" onclick="closeModal()">✖</span>
<iframe id="frame"></iframe>
</div>

<script>
function updateJam(){
const now=new Date();
document.getElementById("jam").innerText=now.toLocaleTimeString('id-ID');
document.getElementById("tanggal").innerText=
now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(updateJam,1000);

function openModal(link){
document.getElementById("modal").style.display="block";
document.getElementById("frame").src=link;
}
function closeModal(){
document.getElementById("modal").style.display="none";
}
</script>

</body>
</html>
