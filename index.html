<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiMUNBAR - Pelayanan Desa</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0b0b0b;
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#111;
}
.logo-box img {
    height:60px;
}

/* JAM */
.clock-time {
    font-size:26px;
    color:#00ffd5;
}
.clock-date {
    font-size:14px;
}

/* HERO */
.hero-wrap {
    position:relative;
    max-width:1200px;
    margin:auto;
}
.hero-img {
    width:100%;
    display:block;
}

/* HOTSPOT PREMIUM */
.hotspot {
    position:absolute;
    border-radius:20px;
    cursor:pointer;
    overflow:hidden;
    transition:0.3s;
}

/* GLOW HIDUP */
.hotspot::before {
    content:"";
    position:absolute;
    inset:0;
    border-radius:20px;
    box-shadow:0 0 15px #00ffd5;
    opacity:0.6;
    animation:pulseGlow 2s infinite;
}

/* GARIS BERGERAK */
.hotspot::after {
    content:"";
    position:absolute;
    top:-100%;
    left:-100%;
    width:200%;
    height:200%;
    background:linear-gradient(120deg,
        transparent,
        rgba(0,255,213,0.3),
        transparent);
    animation:scanMove 3s linear infinite;
}

/* HOVER */
.hotspot:hover::before {
    box-shadow:0 0 30px #00ffd5, 0 0 60px #00ffd5;
    opacity:1;
}

/* KLIK */
.hotspot:active {
    transform:scale(0.95);
}

/* POSISI */
.tamu {
    top:45%;     /* naik ke atas */
    left:5%;
    width:25%;
    height:35%;  /* lebih tinggi */
}

.surat {
    top:45%;
    left:37%;
    width:25%;
    height:35%;
}

.aduan {
    top:45%;
    left:69%;
    width:25%;
    height:35%;
}

/* ANIMASI */
@keyframes pulseGlow {
    0% { box-shadow:0 0 10px #00ffd5; }
    50% { box-shadow:0 0 25px #00ffd5; }
    100% { box-shadow:0 0 10px #00ffd5; }
}

@keyframes scanMove {
    0% { transform:translate(-100%, -100%) rotate(25deg); }
    100% { transform:translate(100%, 100%) rotate(25deg); }
}

/* TEXT BERJALAN */
.marquee {
    background:#111;
    padding:10px;
    text-align:center;
    color:#00ffd5;
    font-weight:bold;
}

/* MENU */
.menu {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}
.card {
    width:300px;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}
.card:hover {
    transform:scale(1.05);
}
.card img {
    width:100%;
}
.card h3 {
    text-align:center;
    padding:15px;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    z-index:2000;
}
.modal iframe {
    width:90%;
    height:90%;
    margin:3% auto;
    display:block;
    border:none;
    background:white;
    border-radius:10px;
}
.close {
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
}

/* FOOTER */
.footer {
    text-align:center;
    padding:20px;
    background:#111;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo-box">
        <img src="https://muningbaru1-design.github.io/pelayanan-desa/logo-simunbar.png">
    </div>

    <div>
        <div class="clock-time" id="jam"></div>
        <div class="clock-date" id="tanggal"></div>
    </div>
</div>

<!-- HERO -->
<div class="hero-wrap">

    <img src="template-pelayanan.png" class="hero-img">

    <div class="hotspot tamu"
        onclick="openModal('https://forms.gle/8ipvJkeh76VHPsAW8')"></div>

    <div class="hotspot surat"
        onclick="openModal('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')"></div>

    <div class="hotspot aduan"
        onclick="openModal('https://forms.gle/o864Q2Jdh42QEXRB7')"></div>

</div>

<!-- TEXT -->
<div class="marquee">
<marquee>SELAMAT DATANG DI PELAYANAN KANTOR DESA MUNING BARU</marquee>
</div>

<!-- MENU -->
<div class="menu">

    <div class="card" onclick="openModal('https://forms.gle/8ipvJkeh76VHPsAW8')">
        <img src="template-pelayanan.png">
        <h3>Buku Tamu 🔵 <span id="notifTamu">0</span></h3>
    </div>

    <div class="card" onclick="openModal('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')">
        <img src="template-pelayanan.png">
        <h3>Pelayanan Surat 🔴 <span id="notifSurat">0</span></h3>
    </div>

    <div class="card" onclick="openModal('https://forms.gle/o864Q2Jdh42QEXRB7')">
        <img src="template-pelayanan.png">
        <h3>Aduan & Saran 🔴 <span id="notifAduan">0</span></h3>
    </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <span class="close" onclick="closeModal()">✖</span>
    <iframe id="frame"></iframe>
</div>

<!-- FOOTER -->
<div class="footer">
© 2026 Desa Muning Baru
</div>

<script>

/* JAM */
function updateJam(){
    const now=new Date();
    document.getElementById("jam").innerText=now.toLocaleTimeString('id-ID');
    document.getElementById("tanggal").innerText=
    now.toLocaleDateString('id-ID',{
        weekday:'long',day:'numeric',month:'long',year:'numeric'
    });
}
setInterval(updateJam,1000);

/* MODAL */
function openModal(link){
    document.getElementById("modal").style.display="block";
    document.getElementById("frame").src=link;
}
function closeModal(){
    document.getElementById("modal").style.display="none";
    document.getElementById("frame").src="";
}

/* DATA */
async function ambilData(){

const [tamu,surat,aduan]=await Promise.all([
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vTf0YY597JgnBlEeoq375PxbGMzpq0Eum3qF57iU-HvAG0GviT8x7Feh6pvwm16bVfbtGRVWiHTtln5/pub?gid=53317010&single=true&output=csv").then(r=>r.text()),
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vSNSqZmr8mhDwdRlNFZUvnKE9MRyT5zFKi4YiNXWukqp6zZuoCRoluLdBtgMBpJEZ84xI0Oc9cuo4Io/pub?gid=595147775&single=true&output=csv").then(r=>r.text()),
fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vR_5xLKXz0SzzQgs-CTw7M3A5hiVZ2UyttODKK-vPFVvHup81fE_wLus-FWCXygXVxJ2te9Ni5FqSoD/pub?gid=1837680240&single=true&output=csv").then(r=>r.text())
]);

document.getElementById("notifTamu").innerText=tamu.split("\n").length-1;
document.getElementById("notifSurat").innerText=surat.split("\n").length-1;
document.getElementById("notifAduan").innerText=aduan.split("\n").length-1;

}

ambilData();

</script>

</body>
</html>
