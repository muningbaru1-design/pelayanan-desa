<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pelayanan Digital Desa Muning Baru</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #1a1a1a, #000);
  color: white;
  text-align: center;
}

/* HEADER */
.header {
  padding: 25px;
}

.logo {
  width: 110px;
}

.title {
  font-size: 28px;
  font-weight: bold;
  color: gold;
}

.subtitle {
  font-size: 14px;
  opacity: 0.8;
}

.clock {
  margin-top: 5px;
  font-size: 14px;
  color: #ccc;
}

/* CONTAINER */
.container {
  display: flex;
  justify-content: center;
  gap: 35px;
  padding: 40px;
  flex-wrap: wrap;
}

/* CARD */
.card {
  width: 280px;
  height: 220px;
  border-radius: 25px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  cursor: pointer;
  transition: 0.3s;
  position: relative;
  overflow: hidden;
}

/* GLOW */
.card::before {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 25px;
  background: linear-gradient(45deg, gold, orange, gold);
  filter: blur(15px);
  opacity: 0.5;
  z-index: -1;
}

/* HOVER */
.card:hover {
  transform: scale(1.07);
}

/* ICON */
.icon {
  font-size: 50px;
  margin-top: 35px;
}

/* TEXT */
.card h2 {
  margin: 10px 0 5px;
}

.card p {
  font-size: 14px;
  opacity: 0.7;
}

/* WARNA */
.tamu { background: linear-gradient(135deg, #065f46, #022c22); }
.surat { background: linear-gradient(135deg, #1e3a8a, #0c1c4d); }
.aduan { background: linear-gradient(135deg, #6b21a8, #2e1065); }

/* FOOTER */
.footer {
  margin-top: 20px;
  padding: 10px;
  font-size: 14px;
  opacity: 0.7;
}

/* BUTTON CLICK EFFECT */
.card:active {
  transform: scale(0.95);
}
</style>
</head>

<body>

<div class="header">
  <img src="https://website.desa.id/assets/files/data/website-desa-muning-baru-6306072001/images/bumdes/LGO_DESA_2022_1_.png" class="logo">
  
  <div class="title">PELAYANAN DIGITAL</div>
  <div class="subtitle">PEMERINTAH DESA MUNING BARU</div>
  
  <div class="clock" id="clock"></div>
</div>

<div class="container">

<div class="card tamu" onclick="goLink('https://forms.gle/8ipvJkeh76VHPsAW8')">
  <div class="icon">📖</div>
  <h2>Buku Tamu</h2>
  <p>Isi kehadiran sebelum pelayanan</p>
</div>

<div class="card surat" onclick="goLink('https://www.instagram.com/p/DXZDY5OEjw9/?igsh=MW0ybTZ1NW1mbTVjdQ==')">
  <div class="icon">📄</div>
  <h2>Pelayanan Surat</h2>
  <p>Lihat persyaratan lengkap</p>
</div>

<div class="card aduan" onclick="goLink('https://forms.gle/o864Q2Jdh42QEXRB7')">
  <div class="icon">💬</div>
  <h2>Aduan & Saran</h2>
  <p>Sampaikan masukan Anda</p>
</div>

</div>

<div class="footer">
  ✨ Melayani dengan Sepenuh Hati ✨
</div>

<audio id="clickSound">
  <source src="https://www.soundjay.com/buttons/sounds/button-16.mp3">
</audio>

<script>
function updateClock() {
  const now = new Date();
  document.getElementById("clock").innerHTML =
    now.toLocaleDateString("id-ID") + " | " +
    now.toLocaleTimeString("id-ID");
}
setInterval(updateClock, 1000);
updateClock();

function goLink(url) {
  document.getElementById("clickSound").play();
  setTimeout(() => {
    window.location.href = url;
  }, 150);
}
</script>

</body>
</html>
