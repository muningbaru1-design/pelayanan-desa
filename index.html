<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiMUNBAR - Pelayanan Desa</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#0b0b0b;
    color:white;
}

/* NAVBAR */
.navbar{
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#111;
    align-items:center;
}
.logo-box img{height:60px}

/* JAM */
.clock-time{font-size:26px;color:#00ffd5}
.clock-date{font-size:14px}

/* ADMIN BUTTON */
.admin-btn{
    background:#00ffd5;
    border:none;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin-left:10px;
}

/* HERO */
.hero-wrap{
    position:relative;
    max-width:1200px;
    margin:auto;
}
.hero-img{
    width:100%;
    display:block;
}

/* HOTSPOT */
.icon-area{
    position:absolute;
    cursor:pointer;
    border-radius:28px;
    transform:translate(-50%, -50%);
}
.tamu{ top:64%; left:21%; width:22%; height:26%; }
.surat{ top:64%; left:50%; width:22%; height:26%; }
.aduan{ top:64%; left:79%; width:22%; height:26%; }

/* GLOW */
.icon-area::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:28px;
    background:rgba(0,255,213,0.10);
    box-shadow:0 0 12px rgba(0,255,213,0.35);
    opacity:0.6;
}

/* CEK STATUS */
.cek-status{
    text-align:center;
    padding:20px;
}
.cek-status input{
    padding:10px;
    width:260px;
    border-radius:8px;
    border:none;
}
.cek-status button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#00ffd5;
    cursor:pointer;
}

/* MENU */
.menu{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}
.card{
    width:300px;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
}
.card img{width:100%}
.card h3{text-align:center;padding:15px}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
}
.modal iframe{
    width:90%;
    height:90%;
    margin:3% auto;
    display:block;
}
.close{
    position:absolute;
    right:20px;
    top:10px;
    font-size:30px;
    cursor:pointer;
}

/* ADMIN PANEL */
.admin-panel{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.85);
    z-index:3000;
}
.admin-box{
    background:#111;
    width:300px;
    padding:25px;
    border-radius:15px;
    text-align:center;
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}
.admin-box input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    border:none;
}
.admin-box button{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:none;
    border-radius:8px;
    background:#00ffd5;
    cursor:pointer;
}
.close-admin{
    position:absolute;
    top:10px;
    right:15px;
    cursor:pointer;
}

.footer{
    text-align:center;
    padding:20px;
    background:#111;
}
</style>
</head>

<body>

<div class="navbar">
<div class="logo-box">
<img src="https://muningbaru1-design.github.io/pelayanan-desa/logo-simunbar.png">
</div>

<div>
<div class="clock-time" id="jam"></div>
<div class="clock-date" id="tanggal"></div>
<button class="admin-btn" onclick="openAdmin()">Admin</button>
</div>
</div>

<div class="hero-wrap">
<img src="template-pelayanan.png" class="hero-img">

<div class="icon-area tamu" onclick="openModal('https://forms.gle/8ipvJkeh76VHPsAW8')"></div>
<div class="icon-area surat" onclick="openModal('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')"></div>
<div class="icon-area aduan" onclick="openModal('https://forms.gle/o864Q2Jdh42QEXRB7')"></div>
</div>

<div class="cek-status">
<input type="text" id="cari" placeholder="Masukkan Nama / NIK">
<button onclick="cekStatus()">Cek Status Surat</button>
<div id="hasilStatus"></div>
</div>

<div class="menu">
<div class="card" onclick="openModal('https://forms.gle/8ipvJkeh76VHPsAW8')">
<img src="template-pelayanan.png">
<h3>Buku Tamu 🔵 <span id="notifTamu">0</span></h3>
</div>

<div class="card" onclick="openModal('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')">
<img src="template-pelayanan.png">
<h3>Surat 🔴 <span id="notifSurat">0</span></h3>
</div>

<div class="card" onclick="openModal('https://forms.gle/o864Q2Jdh42QEXRB7')">
<img src="template-pelayanan.png">
<h3>Aduan 🔴 <span id="notifAduan">0</span></h3>
</div>
</div>

<div id="modal" class="modal">
<span class="close" onclick="closeModal()">✖</span>
<iframe id="frame"></iframe>
</div>

<!-- ADMIN MODERN -->
<div id="adminPanel" class="admin-panel">
<div class="admin-box">
<h3>Login Admin</h3>
<input type="password" id="adminPin" placeholder="Masukkan PIN">
<button onclick="cekLogin()">Masuk</button>

<div id="menuAdmin" style="display:none;">
<button onclick="goAdmin(1)">Buku Tamu</button>
<button onclick="goAdmin(2)">Surat</button>
<button onclick="goAdmin(3)">Aduan</button>
<button onclick="goAdmin(4)">Semua Data</button>
</div>

<span class="close-admin" onclick="closeAdmin()">✖</span>
</div>
</div>

<div class="footer">© 2026 Desa Muning Baru</div>

<script>
setInterval(()=>{
const now=new Date();
document.getElementById("jam").innerText=now.toLocaleTimeString('id-ID');
document.getElementById("tanggal").innerText=
now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
},1000);

/* MODAL */
function openModal(link){
document.getElementById("modal").style.display="block";
document.getElementById("frame").src=link;
}
function closeModal(){
document.getElementById("modal").style.display="none";
}

/* ADMIN */
function openAdmin(){document.getElementById("adminPanel").style.display="block";}
function closeAdmin(){document.getElementById("adminPanel").style.display="none";}

function cekLogin(){
if(document.getElementById("adminPin").value==="12345"){
document.getElementById("menuAdmin").style.display="block";
}else{alert("PIN salah!");}
}

function goAdmin(x){
if(x==1) location.href="https://docs.google.com/spreadsheets/d/e/2PACX-1vTf0YY597JgnBlEeoq375PxbGMzpq0Eum3qF57iU-HvAG0GviT8x7Feh6pvwm16bVfbtGRVWiHTtln5";
if(x==2) location.href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSNSqZmr8mhDwdRlNFZUvnKE9MRyT5zFKi4YiNXWukqp6zZuoCRoluLdBtgMBpJEZ84xI0Oc9cuo4Io";
if(x==3) location.href="https://docs.google.com/spreadsheets/d/e/2PACX-1vR_5xLKXz0SzzQgs-CTw7M3A5hiVZ2UyttODKK-vPFVvHup81fE_wLus-FWCXygXVxJ2te9Ni5FqSoD";
if(x==4) location.href="https://drive.google.com";
}
</script>

</body>
</html>
