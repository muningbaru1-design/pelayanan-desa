<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SiMUNBAR - Pelayanan Desa</title>

<style>
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0b0b0b;
    color:white;
}

/* NAVBAR */
.navbar {
    display:flex;
    justify-content:space-between;
    padding:15px 30px;
    background:#111;
}
.logo-box img {
    height:60px;
}

/* JAM */
.clock-time {
    font-size:26px;
    color:#00ffd5;
}
.clock-date {
    font-size:14px;
}

/* HERO */
.hero img {
    width:100%;
    max-width:1200px;
    display:block;
    margin:auto;
}

/* MENU */
.menu {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:30px;
}
.card {
    width:300px;
    border-radius:20px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}
.card:hover {
    transform:scale(1.05);
}
.card img {
    width:100%;
}
.card h3 {
    text-align:center;
    padding:15px;
}

/* MODAL */
.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    z-index:2000;
}
.modal iframe {
    width:90%;
    height:90%;
    margin:3% auto;
    display:block;
    border:none;
    background:white;
    border-radius:10px;
}
.close {
    position:absolute;
    top:20px;
    right:30px;
    font-size:30px;
    cursor:pointer;
}

/* TEXT BERJALAN */
.marquee {
    background:#111;
    padding:10px;
    text-align:center;
    color:#00ffd5;
    font-weight:bold;
}

.footer {
    text-align:center;
    padding:20px;
    background:#111;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo-box">
        <img src="https://muningbaru1-design.github.io/pelayanan-desa/logo-simunbar.png">
    </div>

    <div>
        <div class="clock-time" id="jam"></div>
        <div class="clock-date" id="tanggal"></div>
    </div>
</div>

<!-- HERO + HOTSPOT -->
<div class="hero">
    <img src="template-pelayanan.png" usemap="#menuMap">

    <map name="menuMap">

        <!-- BUKU TAMU -->
        <area shape="rect" coords="50,250,350,450"
            href="javascript:void(0)"
            onclick="openModal('https://forms.gle/8ipvJkeh76VHPsAW8')">

        <!-- SURAT -->
        <area shape="rect" coords="400,250,700,450"
            href="javascript:void(0)"
            onclick="openModal('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')">

        <!-- ADUAN -->
        <area shape="rect" coords="750,250,1050,450"
            href="javascript:void(0)"
            onclick="openModal('https://forms.gle/o864Q2Jdh42QEXRB7')">

    </map>
</div>

<!-- TEXT BERJALAN -->
<div class="marquee">
    <marquee>SELAMAT DATANG DI PELAYANAN KANTOR DESA MUNING BARU</marquee>
</div>

<!-- MENU BAWAH (TETAP ADA) -->
<div class="menu">

    <div class="card" onclick="openModal('https://forms.gle/8ipvJkeh76VHPsAW8')">
        <img src="template-pelayanan.png">
        <h3>Buku Tamu 🔵 <span id="notifTamu">0</span></h3>
    </div>

    <div class="card" onclick="openModal('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')">
        <img src="template-pelayanan.png">
        <h3>Pelayanan Surat 🔴 <span id="notifSurat">0</span></h3>
    </div>

    <div class="card" onclick="openModal('https://forms.gle/o864Q2Jdh42QEXRB7')">
        <img src="template-pelayanan.png">
        <h3>Aduan & Saran 🔴 <span id="notifAduan">0</span></h3>
    </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <span class="close" onclick="closeModal()">✖</span>
    <iframe id="frame"></iframe>
</div>

<!-- FOOTER -->
<div class="footer">
    © 2026 Desa Muning Baru
</div>

<script>

/* JAM */
function updateJam() {
    const now = new Date();
    document.getElementById("jam").innerText =
        now.toLocaleTimeString('id-ID');

    document.getElementById("tanggal").innerText =
        now.toLocaleDateString('id-ID', {
            weekday:'long',
            day:'numeric',
            month:'long',
            year:'numeric'
        });
}
setInterval(updateJam,1000);

/* MODAL */
function openModal(link){
    document.getElementById("modal").style.display="block";
    document.getElementById("frame").src=link;
}
function closeModal(){
    document.getElementById("modal").style.display="none";
    document.getElementById("frame").src="";
}

/* NOTIFIKASI */
async function ambilData() {

  const urlTamu = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTf0YY597JgnBlEeoq375PxbGMzpq0Eum3qF57iU-HvAG0GviT8x7Feh6pvwm16bVfbtGRVWiHTtln5/pub?gid=53317010&single=true&output=csv";
  const urlSurat = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSNSqZmr8mhDwdRlNFZUvnKE9MRyT5zFKi4YiNXWukqp6zZuoCRoluLdBtgMBpJEZ84xI0Oc9cuo4Io/pub?gid=595147775&single=true&output=csv";
  const urlAduan = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_5xLKXz0SzzQgs-CTw7M3A5hiVZ2UyttODKK-vPFVvHup81fE_wLus-FWCXygXVxJ2te9Ni5FqSoD/pub?gid=1837680240&single=true&output=csv";

  const [tamu, surat, aduan] = await Promise.all([
    fetch(urlTamu).then(r=>r.text()),
    fetch(urlSurat).then(r=>r.text()),
    fetch(urlAduan).then(r=>r.text())
  ]);

  document.getElementById("notifTamu").innerText = tamu.split("\n").length - 1;
  document.getElementById("notifSurat").innerText = surat.split("\n").length - 1;
  document.getElementById("notifAduan").innerText = aduan.split("\n").length - 1;
}

ambilData();

</script>

</body>
</html>
