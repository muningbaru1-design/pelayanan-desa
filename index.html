<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelayanan Desa Muning Baru</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:#050505;
    text-align:center;
}

/* JUDUL */
h2 {
    color:white;
    margin:20px;
}

/* CONTAINER */
.wrapper {
    position:relative;
    max-width:1000px;
    margin:auto;
    animation:fadeUp 1s ease;
}

/* GAMBAR */
.wrapper img {
    width:100%;
    display:block;
    border-radius:20px;
}

/* OVERLAY */
.overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(to top, rgba(0,0,0,0.25), transparent);
    border-radius:20px;
}

/* TOMBOL */
.btn {
    position:absolute;
    width:28%;
    height:42%;
    top:60%;
    transform:translateY(-55%);
    cursor:pointer;
    border-radius:20px;
    transition:0.3s;
}

/* POSISI */
.btn1 { left:5%; }
.btn2 { left:36%; }
.btn3 { left:67%; }

/* HOVER */
.btn:hover {
    background:rgba(255,255,255,0.1);
    box-shadow:0 0 20px rgba(0,255,200,0.5);
    transform:translateY(-55%) scale(1.05);
}

/* ANIMASI MASUK */
@keyframes fadeUp {
    from {opacity:0; transform:translateY(30px);}
    to {opacity:1; transform:translateY(0);}
}

/* RUNNING TEXT */
.running-text {
    width:100%;
    overflow:hidden;
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    color:white;
    padding:10px 0;
    margin-top:20px;
    box-shadow:0 0 15px rgba(0,255,200,0.4);
}

.running-text p {
    display:inline-block;
    white-space:nowrap;
    animation:jalan 12s linear infinite;
    font-weight:bold;
}

/* ANIMASI TEKS */
@keyframes jalan {
    from { transform:translateX(100%); }
    to { transform:translateX(-100%); }
}

/* JAM ANALOG */
#clock {
    position:absolute;
    top:20px;
    right:20px;
    width:90px;
    height:90px;
    background:rgba(0,0,0,0.5);
    border-radius:50%;
    box-shadow:0 0 15px rgba(0,255,200,0.6);
    backdrop-filter:blur(5px);
}

/* RESPONSIVE */
@media(max-width:768px){
    .btn {
        height:40%;
        top:62%;
    }
    #clock {
        width:70px;
        height:70px;
    }
}
</style>

</head>
<body>

<h2>Pelayanan Digital Desa Muning Baru</h2>

<div class="wrapper">

    <img src="template-pelayanan.png">

    <div class="overlay"></div>

    <!-- JAM -->
    <canvas id="clock"></canvas>

    <!-- Buku Tamu -->
    <div class="btn btn1" onclick="buka('https://forms.gle/8ipvJkeh76VHPsAW8')"></div>

    <!-- Pelayanan Surat -->
    <div class="btn btn2" onclick="buka('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')"></div>

    <!-- Aduan -->
    <div class="btn btn3" onclick="buka('https://forms.gle/o864Q2Jdh42QEXRB7')"></div>

</div>

<!-- RUNNING TEXT -->
<div class="running-text">
    <p>✨ SELAMAT DATANG DI PELAYANAN KANTOR DESA MUNING BARU ✨</p>
</div>

<script>
function buka(url){
    window.open(url, "_blank");
}

/* JAM ANALOG */
const canvas = document.getElementById("clock");
const ctx = canvas.getContext("2d");

canvas.width = 90;
canvas.height = 90;

function drawClock(){
    const now = new Date();
    const sec = now.getSeconds();
    const min = now.getMinutes();
    const hr = now.getHours();

    ctx.clearRect(0,0,90,90);

    // lingkaran
    ctx.beginPath();
    ctx.arc(45,45,40,0,Math.PI*2);
    ctx.strokeStyle = "#00ffd5";
    ctx.lineWidth = 3;
    ctx.stroke();

    // jarum
    drawHand((hr%12)*30 + min/2, 20, 4);
    drawHand(min*6, 30, 3);
    drawHand(sec*6, 35, 2, "red");
}

function drawHand(angle, length, width, color="#00ffd5"){
    const rad = angle*Math.PI/180;
    ctx.beginPath();
    ctx.moveTo(45,45);
    ctx.lineTo(
        45 + length*Math.cos(rad - Math.PI/2),
        45 + length*Math.sin(rad - Math.PI/2)
    );
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.stroke();
}

setInterval(drawClock, 1000);
drawClock();
</script>

</body>
</html>
