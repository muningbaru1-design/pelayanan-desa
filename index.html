<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelayanan Desa Muning Baru</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:#050505;
    text-align:center;
}

h2 {
    color:white;
    margin:20px;
}

/* WRAPPER */
.wrapper {
    position:relative;
    max-width:1000px;
    margin:auto;
}

.wrapper img {
    width:100%;
    border-radius:20px;
}

.overlay {
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    background:linear-gradient(to top, rgba(0,0,0,0.25), transparent);
    border-radius:20px;
}

/* TOMBOL GAMBAR */
.btn {
    position:absolute;
    width:28%;
    height:42%;
    top:60%;
    transform:translateY(-55%);
    cursor:pointer;
    border-radius:20px;
}

.btn1 { left:5%; }
.btn2 { left:36%; }
.btn3 { left:67%; }

.btn:hover {
    background:rgba(255,255,255,0.1);
    box-shadow:0 0 20px rgba(0,255,200,0.5);
}

/* JAM DIGITAL */
.clock-box {
    position:absolute;
    top:20px;
    right:20px;
    background:rgba(0,0,0,0.6);
    padding:10px 15px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,255,200,0.6);
    backdrop-filter:blur(5px);
}

.time {
    font-size:22px;
    color:#00ffd5;
    font-weight:bold;
}

.date {
    font-size:12px;
}

/* MENU TAMBAHAN */
.extra-menu {
    margin-top:25px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.extra-btn {
    padding:15px 25px;
    border-radius:15px;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    color:white;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

.extra-btn:hover {
    transform:scale(1.05);
    box-shadow:0 0 15px rgba(0,255,200,0.6);
}

/* RUNNING TEXT */
.running-text {
    margin-top:20px;
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    padding:10px;
    color:white;
    overflow:hidden;
}

.running-text p {
    display:inline-block;
    white-space:nowrap;
    animation:jalan 12s linear infinite;
}

@keyframes jalan {
    from { transform:translateX(100%); }
    to { transform:translateX(-100%); }
}

</style>
</head>

<body>

<h2>Pelayanan Digital Desa Muning Baru</h2>

<div class="wrapper">

    <img src="template-pelayanan.png">
    <div class="overlay"></div>

    <!-- JAM -->
    <div class="clock-box">
        <div id="jam" class="time"></div>
        <div id="tanggal" class="date"></div>
    </div>

    <!-- 3 MENU UTAMA -->
    <div class="btn btn1" onclick="buka('https://forms.gle/8ipvJkeh76VHPsAW8')"></div>

    <div class="btn btn2" onclick="buka('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')"></div>

    <div class="btn btn3" onclick="buka('https://forms.gle/o864Q2Jdh42QEXRB7')"></div>

</div>

<!-- MENU TAMBAHAN -->
<div class="extra-menu">

    <div class="extra-btn" onclick="alert('Fitur Cek Status (bisa dihubungkan ke Google Sheet / sistem)')">
        🔍 Cek Status Surat
    </div>

    <div class="extra-btn" onclick="buka('https://muningbaru1.blogspot.com/?m=1')">
        📄 Persyaratan Surat
    </div>

</div>

<!-- RUNNING TEXT -->
<div class="running-text">
<p>✨ SELAMAT DATANG DI PELAYANAN KANTOR DESA MUNING BARU ✨</p>
</div>

<script>
function buka(url){
    window.open(url, "_blank");
}

/* JAM */
function updateJam(){
    const now = new Date();

    const hari = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
    const bulan = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

    let h = String(now.getHours()).padStart(2,'0');
    let m = String(now.getMinutes()).padStart(2,'0');
    let s = String(now.getSeconds()).padStart(2,'0');

    document.getElementById("jam").innerHTML = `${h}:${m}:${s}`;

    document.getElementById("tanggal").innerHTML =
        `${hari[now.getDay()]}, ${now.getDate()} ${bulan[now.getMonth()]} ${now.getFullYear()}`;
}

setInterval(updateJam,1000);
updateJam();
</script>

</body>
</html>
