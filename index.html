<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelayanan Desa Muning Baru</title>

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:#050505;
    text-align:center;
}

/* JUDUL */
h2 {
    color:white;
    margin:20px;
}

/* CONTAINER */
.wrapper {
    position:relative;
    max-width:1000px;
    margin:auto;
    animation:fadeUp 1s ease;
}

/* GAMBAR */
.wrapper img {
    width:100%;
    display:block;
    border-radius:20px;
}

/* OVERLAY */
.overlay {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(to top, rgba(0,0,0,0.25), transparent);
    border-radius:20px;
}

/* TOMBOL */
.btn {
    position:absolute;
    width:28%;
    height:42%;
    top:60%;
    transform:translateY(-55%);
    cursor:pointer;
    border-radius:20px;
    transition:0.3s;
}

/* POSISI */
.btn1 { left:5%; }
.btn2 { left:36%; }
.btn3 { left:67%; }

/* EFEK HOVER */
.btn:hover {
    background:rgba(255,255,255,0.1);
    box-shadow:0 0 20px rgba(0,255,200,0.5);
    transform:translateY(-55%) scale(1.05);
}

/* ANIMASI MASUK */
@keyframes fadeUp {
    from {opacity:0; transform:translateY(30px);}
    to {opacity:1; transform:translateY(0);}
}

/* RUNNING TEXT */
.running-text {
    width:100%;
    overflow:hidden;
    background:linear-gradient(90deg,#00c6ff,#0072ff);
    color:white;
    padding:10px 0;
    margin-top:20px;
    box-shadow:0 0 15px rgba(0,255,200,0.4);
}

.running-text p {
    display:inline-block;
    white-space:nowrap;
    animation:jalan 12s linear infinite;
    font-weight:bold;
}

/* ANIMASI TEKS */
@keyframes jalan {
    from { transform:translateX(100%); }
    to { transform:translateX(-100%); }
}

/* RESPONSIVE */
@media(max-width:768px){
    .btn {
        height:40%;
        top:62%;
    }
}
</style>

</head>
<body>

<h2>Pelayanan Digital Desa Muning Baru</h2>

<div class="wrapper">

    <img src="template-pelayanan.png">

    <div class="overlay"></div>

    <!-- Buku Tamu -->
    <div class="btn btn1" onclick="buka('https://forms.gle/8ipvJkeh76VHPsAW8')"></div>

    <!-- Pelayanan Surat -->
    <div class="btn btn2" onclick="buka('https://docs.google.com/forms/d/e/1FAIpQLScJu578Dd6od4C4VFW0JGOAGXkk9lDIgeb5TDE0qj6FBRWgNQ/viewform')"></div>

    <!-- Aduan -->
    <div class="btn btn3" onclick="buka('https://forms.gle/o864Q2Jdh42QEXRB7')"></div>

</div>

<!-- RUNNING TEXT -->
<div class="running-text">
    <p>✨ SELAMAT DATANG DI PELAYANAN KANTOR DESA MUNING BARU ✨</p>
</div>

<script>
function buka(url){
    window.open(url, "_blank");
}
</script>

</body>
</html>
